<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yadavi Ji Dodh Nikale</title>
<style>
:root{box-sizing:border-box;--ink:#2b1a0e;--card:rgba(255,248,230,.95);--acc:#e8590c;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#2b1a0e}}
html,body{height:100%;margin:0;overflow:hidden;background:#87ceeb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:absolute;inset:0}
#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.pill{background:var(--card);color:var(--ink);padding:8px 14px;border-radius:20px;font-weight:700;font-size:18px}
#mute{pointer-events:auto;border:0;font-size:20px;cursor:pointer}
#warn{position:absolute;top:16%;width:100%;text-align:center;font-size:40px;font-weight:900;color:#d00;text-shadow:0 2px 0 #fff;display:none}
#pop{position:absolute;top:28%;width:100%;text-align:center;font-size:36px;font-weight:900;color:#fff;text-shadow:0 2px 6px #000;opacity:0;transition:opacity .4s}
#btns{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:12px;padding:0 12px}
#btns button{flex:1;height:84px;border:0;border-radius:18px;font-size:20px;font-weight:800;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.3)}
#bm{background:#2f9e44}#bd{background:#e03131}
#btns button:active{transform:translateY(3px)}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);padding:16px}
.box{background:var(--card);color:var(--ink);border-radius:20px;padding:22px;max-width:380px;text-align:center}
.box h1{margin:0 0 8px;font-size:26px;color:var(--acc)}
.box p{margin:6px 0;font-size:16px;line-height:1.4}
.box button{margin-top:12px;border:0;background:var(--acc);color:#fff;font-size:20px;font-weight:800;padding:12px 28px;border-radius:14px;cursor:pointer}
.say{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:8px 10px;font-weight:700;margin:10px 0}
</style>
</head>

const bHome={x:500,y:372},bUp={x:392,y:312};let bk={x:500,y:372,r:0};
const warnEl=$('warn');
function setBox(h){$('box').innerHTML=h}
function menu(){setBox('<h1>🐃 Yadavi Ji Dodh Nikale</h1><p>Chacha dudh nikal rahe hain. Aap unki madad karo!</p><p>🥛 <b>DUDH NIKALO</b> dabaye rakho (Space)<br>🪣 Laat aate hi <b>BALTI BACHAO</b> dabao (B)</p><p>Jitni balti bhari, utne point. Laat lagi to <b>OUT!</b></p><button id="go">Khelo ▶</button>');$('go').onclick=start}
function start(){initAudio();unlockVoice();score=0;fill=0;dodge=0;cd=0;phase='idle';pt=2;fly=null;hit=false;tgt=0;bk={x:500,y:372,r:0};$('sc').textContent=0;state='play';$('ov').style.display='none'}
function over(){state='over';fly={vx:-260,vy:-420,vr:7};warnEl.style.display='none';
 const line='Kab aaoge mere Akhilesh, tumhe UP bolati hai';speak(line);
 setTimeout(()=>{setBox('<h1>OUT! 💥</h1><p>Aapne <b>'+score+'</b> balti dudh bachaya</p><div class="say">🐃 "'+line+'"</div><button id="go">Phir se khelo ▶</button>');$('go').onclick=start;$('ov').style.display='flex'},1100)}
function speak(){if(muted)return;try{VOICE.currentTime=0;const p=VOICE.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
function unlockVoice(){try{VOICE.muted=true;const p=VOICE.play();const d=()=>{VOICE.pause();VOICE.currentTime=0;VOICE.muted=false};if(p&&p.then)p.then(d).catch(()=>{VOICE.muted=false});else d()}catch(e){}}
// input
const bm=$('bm'),bd=$('bd');
bm.onpointerdown=()=>hold=true;['pointerup','pointerleave','pointercancel'].forEach(e=>bm.addEventListener(e,()=>hold=false));
function doDodge(){if(state==='play'&&dodge<=0&&cd<=0){dodge=.9;cd=1.1}}
bd.onpointerdown=doDodge;
addEventListener('keydown',e=>{if(e.code==='Space'){hold=true;e.preventDefault()}if(e.code==='KeyB'||e.code==='ArrowDown')doDodge()});
addEventListener('keyup',e=>{if(e.code==='Space')hold=false});
// audio (original folk-style tune + dhol)
let ac,master,step=0;
function initAudio(){if(ac)return;try{ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.25;master.connect(ac.destination)}catch(e){}}
const mel=[0,2,4,7,9,7,4,2,0,4,7,9,12,9,7,4,9,7,4,2,4,7,4,0,2,4,2,0,-3,0,2,0];
function note(f,d,t,v){const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(master);o.start();o.stop(ac.currentTime+d)}
function tick(){if(!ac||state==='menu')return;if(ac.state==='suspended')ac.resume();const s=step++%mel.length;note(293.66*Math.pow(2,mel[s]/12),.4,'triangle',.5);if(s%2===0)note(95,.25,'sine',1);else note(520,.07,'square',.12);if(s%4===3)note(140,.12,'sine',.7)}
$('mute').onclick=()=>{muted=!muted;if(master)master.gain.value=muted?0:.25;$('mute').textContent=muted?'🔇':'🔊';if(muted)try{VOICE.pause()}catch(e){}};
// drawing helpers
const poly=(pts,c)=>{x.fillStyle=c;x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.fill()};
const ell=(cx,cy,rx,ry,c)=>{x.fillStyle=c;x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,7);x.fill()};
const rect=(a,b,w,h,c)=>{x.fillStyle=c;x.fillRect(a,b,w,h)};
const line=(pts,c,w)=>{x.strokeStyle=c;x.lineWidth=w;x.lineCap='round';x.lineJoin='round';x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke()};
function bucketAt(b,f){x.save();x.translate(b.x,b.y);x.rotate(b.r);poly([[-28,-44],[28,-44],[22,0],[-22,0]],'#b8bcc6');
 if(f>0){const h=40*f;poly([[-27+ (1-f)*0,-2-h],[27,-2-h],[21.5,-2],[-21.5,-2]].map((p,i)=>i<2?[p[0]*(1-.0),p[1]]:p),'#fff')}
 line([[-26,-44],[0,-62],[26,-44]],'#777',3);x.restore()}
function scene(dt){
 const wob=state==='play'&&hold&&dodge<=0?Math.sin(time*14):0;
 // sky, sea, sand (extend beyond logical area)
 const g=x.createLinearGradient(0,-200,0,200);g.addColorStop(0,'#5bb8f0');g.addColorStop(1,'#cdeeff');x.fillStyle=g;x.fillRect(-2000,-1000,4800,1200);
 ell(660,20,34,34,'#ffd43b');
 rect(-2000,150,4800,70,'#1c7ed6');
 x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=3;x.beginPath();for(let i=-200;i<1000;i+=12){const yy=210+Math.sin(i*.05+time*1.5)*4;i<=-200?x.moveTo(i,yy):x.lineTo(i,yy)}x.stroke();
 rect(-2000,220,4800,1500,'#f0d9a0');rect(-2000,372,4800,3,'rgba(150,110,50,.25)');
 // palm
 line([[70,372],[80,260],[72,150]],'#7a5230',16);for(let i=0;i<5;i++){const a=-2.6+i*.55;line([[72,150],[72+Math.cos(a)*55,150+Math.sin(a)*35-10]],'#2f9e44',9)}
 // buffalo
 const bob=Math.sin(time*2)*1.5;
 // far legs
 rect(395,290,24,82,'#1d1d22');rect(588,290,24,82,'#1d1d22');
 // tail
 line([[640,225],[660+Math.sin(time*3)*10,260],[655+Math.sin(time*3)*14,310]],'#2b2b30',7);
 // body
 ell(490,248+bob,150,62,'#2b2b30');
 // head
 const hx=330,hy=238+bob;
 poly([[hx-40,hy-22],[hx+30,hy-30],[hx+45,hy+18],[hx-20,hy+40],[hx-55,hy+25]],'#2b2b30');
 ell(hx-48,hy+28,24,18,'#55555e');rect(hx-14,hy-4,7,7,'#fff');
 line([[hx+15,hy-30],[hx+25,hy-65],[hx+5,hy-82]],'#e8e0c8',9);line([[hx-5,hy-26],[hx-22,hy-52],[hx-45,hy-55]],'#e8e0c8',8);
 // udder
 ell(505,302+bob,30,22,'#ffb6c1');
 // front/hind near legs
 rect(380,290,26,82,'#2b2b30');rect(574,290,26,82,'#2b2b30');
 // kicker leg
 x.save();x.translate(560,292+bob);x.rotate(kang);rect(-13,0,26,76,'#2b2b30');rect(-14,70,28,8,'#e8e0c8');x.restore();
 // man on stool
 const hp=dodge>0?bk:null;
 rect(406,338,40,8,'#8b5a2b');rect(412,346,5,26,'#8b5a2b');rect(436,346,5,26,'#8b5a2b');
 line([[420,334],[462,336],[466,372]],'#3b5bdb',14);rect(458,368,26,8,'#222');
 line([[420,334],[420,282]],'#fff',26);
 ell(424,262,16,17,'#c68642');ell(424,250,18,10,'#fff');rect(406,252,36,5,'#e8590c');rect(432,262,5,3,'#222');
 let hand;if(dodge>0){hand={x:bk.x-8,y:bk.y-58}}else{hand={x:488+(wob?wob*4:0),y:314+(wob?Math.abs(wob)*8:0)}}
 const el={x:(430+hand.x)/2,y:(290+hand.y)/2+22};line([[430,290],[el.x,el.y],[hand.x,hand.y]],'#c68642',9);
 // milk stream
 if(state==='play'&&hold&&dodge<=0){x.strokeStyle='#fff';x.lineWidth=3;for(let k=-1;k<=1;k++){x.beginPath();x.moveTo(505+k*8,322);x.lineTo(500+k*5,372-40*fill-6);x.stroke()}}
 // bucket
 bucketAt(bk,fill);
}
let last=performance.now(),popT=0;
function frame(n){requestAnimationFrame(frame);const dt=Math.min((n-last)/1000,.05);last=n;time+=dt;
 if(state==='play'){
  cd-=dt;const dodged=dodge>0;dodge-=dt;
  if(hold&&!dodged){fill+=dt*.4;if(fill>=1){fill=0;score++;$('sc').textContent=score;$('pop').style.opacity=1;popT=.8}}
  pt-=dt;
  if(phase==='idle'&&pt<=0){phase='warn';pt=Math.max(.65,1.2-.03*score);warnEl.style.display='block'}
  else if(phase==='warn'&&pt<=0){phase='kick';pt=.45;hit=false;warnEl.style.display='none'}
  else if(phase==='kick'){if(!hit&&pt<.3){hit=true;if(dodge<=0)over()}if(pt<=0){phase='idle';pt=(1.6+Math.random()*1.6)*Math.max(.7,1-.02*score)}}
  tgt=phase==='warn'?.25+Math.sin(time*22)*.08:phase==='kick'?1.2:0;
  const T=dodge>0?bUp:bHome,k=Math.min(1,dt*9);bk.x+=(T.x-bk.x)*k;bk.y+=(T.y-bk.y)*k;
 }
 if(state==='over'&&fly){fly.vy+=900*dt;bk.x+=fly.vx*dt;bk.y+=fly.vy*dt;bk.r+=fly.vr*dt;if(bk.y>372){bk.y=372;fly.vx=0;fly.vy=0;fly.vr=0}}
 kang+=(tgt-kang)*Math.min(1,dt*(phase==='kick'?20:8));
 if(popT>0){popT-=dt;if(popT<=0)$('pop').style.opacity=0}
 x.save();x.fillStyle='#87ceeb';x.fillRect(0,0,W,H);x.translate(OX,OY);x.scale(S,S);scene(dt);x.restore()}
menu();requestAnimationFrame(frame);
